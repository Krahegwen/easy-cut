[package]
name = "easy-cut"
version = "0.2.0"
description = "Editor de vídeos"
authors = ["Krahegwen"]
edition = "2021"
publish = false

[lib]
name = "easy_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt", "time"] }
sha2 = "0.10"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"

# Mismas versiones que usa wry: para conceder cámara y micrófono en WebView2.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
